<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Local-first professional resume editor and A4 HTML viewer." />
    <title>Resume Studio</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          const theme = localStorage.getItem('resume-studio-theme');
          if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          } else if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <header id="app-header">
        <div class="header-left">
          <div class="header-brand">
            <h1 class="app-title">Resume Studio</h1>
          </div>

          <nav class="header-nav" role="tablist" aria-label="Main Navigation">
            <button id="nav-tab-editor" class="nav-tab active" type="button" role="tab" aria-selected="true" aria-controls="app-body">
              Editor
            </button>
            <button id="nav-tab-templates" class="nav-tab" type="button" role="tab" aria-selected="false" aria-controls="templates-view">
              Templates
            </button>
          </nav>

          <div class="header-template-selector">
            <label for="header-doc-template" class="visually-hidden">Choose Template</label>
            <select id="header-doc-template" class="header-select" aria-label="Resume template" title="Resume template">
              <option value="classic">Classic (LaTeX)</option>
              <option value="executive">Executive (Two-Column)</option>
            </select>
          </div>

          <span id="dirty-status" class="badge badge-dirty" style="display: none;">Unsaved Changes</span>
          <span id="sync-status" class="badge badge-hosted" style="display: none;" role="status">○ Not Linked</span>
        </div>

        <div class="header-actions">
          <button id="btn-sync-file" class="btn btn-secondary" type="button" title="Link local JSON file on disk for live synchronization">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-right: 0.35rem;">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            Link File
          </button>
          <button id="btn-ai-prompt" class="btn btn-secondary" type="button" title="Copy structured prompt for AI or import AI JSON">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-right: 0.35rem;">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
            </svg>
            AI Prompt
          </button>
          <label class="btn btn-secondary" for="file-import-input" id="lbl-open-json">Open JSON</label>
          <input type="file" id="file-import-input" accept=".json" class="visually-hidden" />
          <button id="btn-export-json" class="btn btn-secondary" type="button">Export JSON</button>
          
          <button id="btn-local-save" class="btn btn-primary" type="button" style="display: none;">Save to File</button>
          <button id="btn-local-reload" class="btn btn-secondary" type="button" style="display: none;">Reload from Disk</button>
          
          <button id="btn-print-action" class="btn btn-primary" type="button">Print / Save PDF</button>
          <button id="btn-theme-toggle" class="btn btn-secondary btn-icon" type="button" aria-label="Toggle light/dark theme" title="Toggle theme">
            <svg id="theme-icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;" aria-hidden="true">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg id="theme-icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
          <button id="btn-help-dialog" class="btn btn-secondary btn-icon" type="button" aria-label="Help and instructions">?</button>
        </div>
      </header>

      <main id="app-main">
        <!-- Editor & Live Preview Tab View -->
        <div id="app-body" class="two-pane-layout" role="tabpanel" aria-labelledby="nav-tab-editor">
          <aside id="editor-pane" class="editor-pane" aria-label="Resume Form Editor">
            <!-- Form Fields Container -->
            <div id="form-container"></div>

            <!-- Metadata & Diagnostics Bar (positioned at bottom of editor) -->
            <div id="editor-meta-bar" class="editor-diagnostics-panel">
              <div id="diagnostics-container"></div>
            </div>
          </aside>

          <!-- Draggable Split Line -->
          <div
            id="pane-resizer"
            class="pane-resizer"
            role="separator"
            aria-orientation="vertical"
            aria-label="Resize panels"
            aria-valuenow="48"
            aria-valuemin="20"
            aria-valuemax="80"
            tabindex="0"
            title="Drag to resize panels (Double-click to reset)"
          >
            <div class="resizer-handle" aria-hidden="true"></div>
          </div>

          <section id="preview-pane" class="preview-pane" aria-label="A4 Resume Preview">
            <!-- Floating Vertical Preview Controls (Right Side Only: +, -, Fit) -->
            <div class="preview-vertical-controls" role="toolbar" aria-label="Preview zoom controls">
              <button id="btn-zoom-in" class="preview-tool-btn" type="button" aria-label="Zoom in (+)" title="Zoom in (+)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              </button>
              <button id="btn-zoom-out" class="preview-tool-btn" type="button" aria-label="Zoom out (−)" title="Zoom out (−)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              </button>
              <button id="btn-zoom-fit" class="preview-tool-btn preview-fit-btn" type="button" aria-label="Fit preview to width" title="Fit to width">
                Fit
              </button>
              <span id="btn-zoom-level" class="visually-hidden" aria-live="polite">100%</span>
            </div>
            <div id="resume-preview" class="resume-preview"></div>
          </section>
        </div>

        <!-- Templates Gallery Tab View (/templates) -->
        <section id="templates-view" class="templates-view" style="display: none;" role="tabpanel" aria-labelledby="nav-tab-templates">
          <!-- Rendered dynamically by templates-view.ts -->
        </section>
      </main>
    </div>

    <!-- Modals Container -->
    <div id="modals-container"></div>

    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
