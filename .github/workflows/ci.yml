name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-matrix:
    name: Test (${{ matrix.os }}, Node 22)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run test suite
        run: npm test

      - name: Run verification script
        run: npm run verify

      - name: Smoke test skill installer
        run: node bin/openresume.mjs install --local

      - name: Smoke test renderer
        run: node bin/openresume.mjs render skills/openresume/starter.json

